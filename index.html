<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5">
  <title>Katalog · EVolution</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="logo">⚡ EVolution</a>
      <nav>
        <ul class="nav-links">
          <li><a href="index.html">Beranda</a></li>
          <li><a href="katalog.html" class="active">Katalog</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container">
        <h2 class="section-title">🚗 Katalog Mobil Listrik</h2>
        <!-- Filter -->
        <div class="filter-container">
          <div class="filter-group">
            <label for="filter-merek">Merek</label>
            <select id="filter-merek">
              <option value="semua">Semua</option>
              <option value="Tesla">Tesla</option>
              <option value="BYD">BYD</option>
              <option value="Hyundai">Hyundai</option>
              <option value="Nissan">Nissan</option>
              <option value="BMW">BMW</option>
              <option value="Wuling">Wuling</option>
            </select>
          </div>
          <div class="filter-group">
            <label for="filter-harga">Harga</label>
            <select id="filter-harga">
              <option value="semua">Semua</option>
              <option value="rendah">Rp 500 jt - 700 jt</option>
              <option value="sedang">Rp 700 jt - 1 M</option>
              <option value="tinggi">> Rp 1 M</option>
            </select>
          </div>
          <button id="reset-filter" class="btn btn-secondary" style="padding: 0.5rem 1.2rem;">Reset</button>
        </div>

        <div class="card-grid" id="catalog-grid">
          <!-- diisi JS -->
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <p>&copy; 2025 EVolution · Mobil Listrik Indonesia</p>
    </div>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/katalog.js"></script>
</body>
</html>
